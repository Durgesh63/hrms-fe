name: Test Runner

on: [push]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create file on Desktop with text
        shell: powershell
        run: |
          $desktop = "$env:USERPROFILE\Desktop"
          $file = Join-Path $desktop "durgesh.txt"
          "Durgesh test runer" | Out-File -FilePath $file -Encoding utf8

      - name: Confirm file created
        shell: powershell
        run: |
          $desktop = "$env:USERPROFILE\Desktop"
          Get-ChildItem $desktop
