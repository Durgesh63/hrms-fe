name: SSH to EC2 and Run Commands

on:
  push:
    branches:
      - master

jobs:
  ssh-job:
    runs-on: ubuntu-latest

    steps:
      - name: Connect to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "Connected to EC2"

            powershell -Command "
              \$desktop = 'C:\Users\Administrator\Desktop';
              \$file = Join-Path \$desktop 'github-ssh-test.txt';
              'File created from GitHub Actions via SSH' | Out-File -FilePath \$file -Encoding utf8;
              Get-ChildItem \$desktop
            "
