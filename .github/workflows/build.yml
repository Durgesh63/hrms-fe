name: Test WinRM Connection

on:
  workflow_dispatch:

jobs:
  winrm-test:
    runs-on: ubuntu-latest

    steps:
      - name: Run command on Windows EC2 via WinRM
        uses: appleboy/winrm-action@v0.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          password: ${{ secrets.EC2_PASSWORD }}
          port: 5985
          protocol: http
          script: |
            echo "Connected via WinRM!"
            hostname
            whoami
            dir C:\
